name: Build Android APK Installer

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses (Pre-installed on ubuntu-latest)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Release Installable APKs
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "LoudSpeakingAlarmProject/settings.gradle.kts" ]; then
            PROJECT_DIR="LoudSpeakingAlarmProject"
          else
            echo "Could not find settings.gradle.kts"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/LoudSpeakingAlarm-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/LoudSpeakingAlarm-release.apk"

      - name: Upload Debug APK Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoudSpeakingAlarm-Debug-APK
          path: dist/LoudSpeakingAlarm-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoudSpeakingAlarm-Release-APK
          path: dist/LoudSpeakingAlarm-release.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LoudSpeakingAlarm-debug.apk
            dist/LoudSpeakingAlarm-release.apk
          generate_release_notes: true
