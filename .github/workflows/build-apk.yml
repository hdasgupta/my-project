name: Build Android APK Installer

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Release Installable APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Installers for Upload
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LoudSpeakingAlarm-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/LoudSpeakingAlarm-release.apk

      - name: Upload Debug APK Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoudSpeakingAlarm-Debug-APK
          path: dist/LoudSpeakingAlarm-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoudSpeakingAlarm-Release-APK
          path: dist/LoudSpeakingAlarm-release.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LoudSpeakingAlarm-debug.apk
            dist/LoudSpeakingAlarm-release.apk
          generate_release_notes: true
